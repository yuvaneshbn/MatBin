<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Glowing Binary Stream Gradient -->
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Transformation Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- MATLAB Matrix Grid Gradient -->
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />

  <!-- Inner Tech Border Accent -->
  <rect x="28" y="28" width="456" height="456" rx="84" ry="84" fill="none" stroke="url(#binGrad)" stroke-width="2" opacity="0.4" />

  <!-- Left Side: Binary Data Block (.bin) -->
  <g transform="translate(64, 120)">
    <!-- Binary File Container Shape -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 100 0 L 132 32 L 132 224 C 132 232.837 124.837 240 116 240 L 16 240 C 7.163 240 0 232.837 0 224 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <path d="M 100 0 L 100 32 L 132 32" fill="none" stroke="#38BDF8" stroke-width="3" />
    
    <!-- Binary Telemetry Digits (01 / Bits) -->
    <text x="24" y="80" font-family="monospace" font-weight="bold" font-size="28" fill="#38BDF8" opacity="0.9">0101</text>
    <text x="24" y="125" font-family="monospace" font-weight="bold" font-size="28" fill="#34D399" opacity="0.9">1010</text>
    <text x="24" y="170" font-family="monospace" font-weight="bold" font-size="28" fill="#38BDF8" opacity="0.9">0110</text>
    <text x="24" y="215" font-family="monospace" font-weight="bold" font-size="28" fill="#F43F5E" opacity="0.9">1101</text>

    <!-- File Label -->
    <rect x="24" y="24" width="60" height="22" rx="4" fill="#38BDF8" opacity="0.2" />
    <text x="32" y="40" font-family="sans-serif" font-weight="bold" font-size="14" fill="#38BDF8">BIN</text>
  </g>

  <!-- Central Conversion Flow Arrow -->
  <g transform="translate(220, 210)" filter="url(#glow)">
    <path d="M 0 20 L 40 20 L 40 0 L 80 35 L 40 70 L 40 50 L 0 50 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Right Side: MATLAB Matrix Container (.mat) -->
  <g transform="translate(316, 120)">
    <!-- MAT File Container Shape -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 100 0 L 132 32 L 132 224 C 132 232.837 124.837 240 116 240 L 16 240 C 7.163 240 0 232.837 0 224 Z" fill="#1E293B" stroke="#EF4444" stroke-width="3" />
    <path d="M 100 0 L 100 32 L 132 32" fill="none" stroke="#EF4444" stroke-width="3" />
    
    <!-- MATLAB 3D Matrix Mesh / Wave Symbol -->
    <g transform="translate(18, 65)">
      <!-- Matrix Grid Gridlines -->
      <path d="M 10 90 Q 48 20 96 90" fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" />
      <path d="M 10 120 Q 48 50 96 120" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <path d="M 10 150 Q 48 80 96 150" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" />

      <!-- Vertical Mesh Connectors -->
      <line x1="28" y1="75" x2="28" y2="135" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
      <line x1="53" y1="42" x2="53" y2="102" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
      <line x1="78" y1="75" x2="78" y2="135" stroke="#38BDF8" stroke-width="2" stroke-dasharray="3,3" opacity="0.7" />
    </g>

    <!-- File Label -->
    <rect x="24" y="24" width="60" height="22" rx="4" fill="#EF4444" opacity="0.2" />
    <text x="30" y="40" font-family="sans-serif" font-weight="bold" font-size="14" fill="#EF4444">MAT</text>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="435" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#F8FAFC" letter-spacing="3">MatBin</text>
  <text x="256" y="460" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="1">BINARY TO MATLAB SERIALIZATION</text>
</svg>